<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff4ff"/>
      <stop offset="1" stop-color="#0090c8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- torre -->
    <rect x="112" y="30" width="176" height="230" rx="14" fill="#071827" fill-opacity=".85"/>
    <!-- painel lateral de vidro -->
    <rect x="132" y="50" width="136" height="178" rx="10" stroke-width="4" opacity=".85"/>
    <!-- fans frontais com glow -->
    <circle cx="200" cy="84" r="26" stroke-width="5"/>
    <circle cx="200" cy="84" r="8" stroke-width="4"/>
    <circle cx="200" cy="146" r="26" stroke-width="5"/>
    <circle cx="200" cy="146" r="8" stroke-width="4"/>
    <circle cx="200" cy="206" r="18" stroke-width="4" opacity=".8"/>
    <!-- componentes internos (GPU) -->
    <path d="M148 176h104" stroke-width="4" opacity=".55"/>
    <path d="M148 190h74" stroke-width="4" opacity=".45"/>
    <!-- faixa RGB -->
    <path d="M132 240h136" stroke-width="5" opacity=".9"/>
    <!-- pés -->
    <path d="M140 260v12M260 260v12" stroke-width="5"/>
    <!-- ventilação superior -->
    <g stroke-width="4" opacity=".65">
      <path d="M156 30l6 12M180 30l6 12M204 30l6 12M228 30l6 12"/>
    </g>
    <!-- brilho ambiente -->
    <path d="M96 96c-14 10-14 34 0 44M304 130c14 10 14 34 0 44" stroke-width="4" opacity=".55"/>
  </g>
</svg>
